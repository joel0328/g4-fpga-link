# regmap.toml - the single source of the MCU <-> FPGA register map.
#
# scripts/gen_regs.py turns this into:
#   rtl/fpga_regs.vh                          Verilog localparams (included by the RTL)
#   firmware/FPGA_Link/Core/Inc/fpga_regs.h   C register map
#   tools/fpga_regs.py, tools/fpga_regs.m     PC-side constants (Python, MATLAB)
#   README.md                                 register table between the regmap markers
#
# After editing: `make regs`, then update the RTL logic and the tests. `make test`
# fails while any generated file is stale. Bump [map].version on any incompatible
# change; fpga_init refuses a mismatch.
#
# [const]: extra named constants, emitted as MAP-level values (C FPGA_<name>).
#
# Registers: name, addr, access (RO, RW, W, RW1C), desc (README text), optional
# reset, words (a block of N consecutive words), fields.
# Fields: name, bits ("n" or "msb:lsb"), optional desc. Each field becomes a C
# macro FPGA_<prefix>_<name>: (1u << n) for one bit, the in-place mask otherwise.
# The prefix is the register name unless the register sets field_prefix ("" for
# none); a field's own `c` key overrides the whole C name. fields_from = "REG"
# shares another register's fields (documented, not emitted twice).

[map]
version    = 5
id         = 0x47344650       # "G4FP"
unmapped   = 0xDEADBEEF       # read value of unmapped addresses
burst_addr = 0x7F             # frame header escape for bursts, never a register
burst_max  = 16               # words per burst frame
clk_hz     = 100_000_000      # FPGA system clock

[const]
ARM_KEY         = 0x41524D21  # "ARM!": the only ARM write that arms
WDT_TICKS_RESET = 3           # WDT_TICKS after reset
LINK_FAULT_ERRS = 4           # rejected frames in a row (while armed) that latch FAULT.LINK
ARM_SWITCH      = 15          # SW15 is the hardware arm enable
SNAP_FAULT_LSB  = 8           # SNAP_SAFETY: FAULT_STATUS bits start here
DUTY_MAX        = 32767       # M1_DUTY/M2_DUTY full scale (Q15: 32767 = 100 %)
DUTY_LIMIT_RESET = 16384      # DUTY_LIMIT after reset (50 %)
PWM_HZ          = 20000       # H-bridge PWM frequency
ENC_FILTER_CLKS = 64          # encoder inputs must be stable this many clocks to count

[[reg]]
name   = "ID"
addr   = 0x00
access = "RO"
reset  = 0x47344650
desc   = '0x47344650 ("G4FP")'

[[reg]]
name   = "VERSION"
addr   = 0x01
access = "RO"
reset  = 5
desc   = "{version}"

[[reg]]
name   = "SCRATCH"
addr   = 0x02
access = "RW"
reset  = 0
desc   = "Link test register"

[[reg]]
name   = "LEDS"
addr   = 0x03
access = "RW"
reset  = 0
desc   = "[13:0] user LEDs, lit only while armed. LED15 = armed and LED14 = fault are driven by the safety layer"
fields = [
    { name = "VALUE", bits = "13:0" },
]

[[reg]]
name   = "SWITCHES"
addr   = 0x04
access = "RO"
desc   = "[15:0] switches, [20:16] buttons U, L, R, D, C (debounced)"
field_prefix = ""
fields = [
    { name = "SW",    bits = "15:0", c = "FPGA_SW_MASK" },
    { name = "BTN_U", bits = "16" },
    { name = "BTN_L", bits = "17" },
    { name = "BTN_R", bits = "18" },
    { name = "BTN_D", bits = "19" },
    { name = "BTN_C", bits = "20" },
]

[[reg]]
name   = "SEG7"
addr   = 0x05
access = "RW"
reset  = 0
desc   = "[15:0] hex digits, [19:16] digit enables, [20] use register (else frame count)"
fields = [
    { name = "HEX",     bits = "15:0" },
    { name = "DIGITS",  bits = "19:16", c = "FPGA_SEG7_ALL_DIGITS" },
    { name = "USE_REG", bits = "20" },
]

[[reg]]
name   = "TICK_DIV"
addr   = 0x06
access = "RW"
reset  = 0
desc   = "LOOP_TICK period in 100 MHz clocks; 0 = off; 100000 = 1 kHz. Writes ignored while armed"

[[reg]]
name   = "TICK_COUNT"
addr   = 0x07
access = "RO"
reset  = 0
desc   = "Ticks since reset"

[[reg]]
name   = "IRQ_STATUS"
addr   = 0x08
access = "RW1C"
reset  = 0
desc   = "[0] tick, [1] switch/button change, [2] CRC error, [3] fault latched (any cause)"
field_prefix = "IRQ"
fields = [
    { name = "TICK",    bits = "0" },
    { name = "INPUTS",  bits = "1" },
    { name = "CRC_ERR", bits = "2" },
    { name = "FAULT",   bits = "3" },
]

[[reg]]
name   = "IRQ_ENABLE"
addr   = 0x09
access = "RW"
reset  = 0
desc   = "Same bits; FPGA_IRQ = any enabled status bit"
fields_from = "IRQ_STATUS"

[[reg]]
name   = "FRAMES_OK"
addr   = 0x0A
access = "RO"
reset  = 0
desc   = "Good frames"

[[reg]]
name   = "CRC_ERRS"
addr   = 0x0B
access = "RO"
reset  = 0
desc   = "Rejected frames"

[[reg]]
name   = "TIME_US"
addr   = 0x0C
access = "RO"
reset  = 0
desc   = "Free-running microsecond timestamp"

[[reg]]
name   = "CTRL"
addr   = 0x0D
access = "W"
desc   = "[0] clear FRAMES_OK, CRC_ERRS, TICK_COUNT and ENC_ERRS"
fields = [
    { name = "CLEAR_COUNTERS", bits = "0" },
]

[[reg]]
name   = "SCRATCH_RAM"
addr   = 0x10
words  = 16
access = "RW"
desc   = "16 free words (burst self-test)"

# ---- Safety layer (map v4). Every actuator output is forced off unless armed.

[[reg]]
name   = "ARM"
addr   = 0x20
access = "RW"
reset  = 0
desc   = "Write ARM_KEY (0x41524D21) to arm: needs SW15 up, no fault, tick running. Any other value disarms. Read: [0] armed, [1] SW15, [2] fault, [3] tick running"
fields = [
    { name = "ARMED",   bits = "0" },
    { name = "SW_EN",   bits = "1" },
    { name = "FAULT",   bits = "2" },
    { name = "TICK_ON", bits = "3" },
]

[[reg]]
name   = "WDT_TICKS"
addr   = 0x21
access = "RW"
reset  = 3
desc   = "[7:0] watchdog limit in loop ticks (1–255, 0 is stored as 1). A tick that finds this many ticks since the last kick latches FAULT.WDT. Writes ignored while armed"
fields = [
    { name = "VALUE", bits = "7:0" },
]

[[reg]]
name   = "FAULT_STATUS"
addr   = 0x22
access = "RO"
reset  = 0
desc   = "Latched causes: [0] WDT missed kicks, [1] LINK 4 rejected frames in a row, [2] ESTOP btnD, [3] ARM_LOST SW15 down while armed. Any fault disarms and holds FAULT_N low"
field_prefix = "FAULT"
fields = [
    { name = "WDT",      bits = "0" },
    { name = "LINK",     bits = "1" },
    { name = "ESTOP",    bits = "2" },
    { name = "ARM_LOST", bits = "3" },
]

[[reg]]
name   = "FAULT_CLEAR"
addr   = 0x23
access = "W"
desc   = "Write 1s to clear FAULT_STATUS bits. ESTOP stays set while btnD is held"
fields_from = "FAULT_STATUS"

[[reg]]
name   = "WDT_KICK"
addr   = 0x24
access = "RW"
reset  = 0
desc   = "Any write feeds the watchdog. Read: [7:0] ticks since the last kick (0 while disarmed)"

# ---- Motors (map v5, M3): two sign-magnitude H-bridge channels (TB6612FNG
# IN1/IN2, 20 kHz PWM on the IN pins) and two quadrature encoders. The duties
# sit right after WDT_KICK so one burst kicks the watchdog and sets both.

[[reg]]
name   = "M1_DUTY"
addr   = 0x25
access = "RW"
reset  = 0
desc   = "[15:0] signed duty, ±32767 = ±100 % (−32768 acts as −32767): positive PWMs IN1, negative IN2, 0 = coast. Clamped to ±DUTY_LIMIT. Reads sign-extended. Held at 0 while disarmed (writes ignored), so arming never starts a motor"
fields = [
    { name = "VALUE", bits = "15:0", c = "FPGA_DUTY_MASK" },
]

[[reg]]
name   = "M2_DUTY"
addr   = 0x26
access = "RW"
reset  = 0
desc   = "Same for motor 2"

[[reg]]
name   = "DUTY_LIMIT"
addr   = 0x27
access = "RW"
reset  = 16384
desc   = "[14:0] largest |duty| applied to either motor; reset 16384 = 50 %. Writes ignored while armed"
fields = [
    { name = "VALUE", bits = "14:0" },
]

[[reg]]
name   = "ENC_ERRS"
addr   = 0x28
access = "RO"
reset  = 0
desc   = "Illegal quadrature transitions (A and B changed together): [15:0] encoder 1, [31:16] encoder 2. Wraps; CTRL[0] clears"
fields = [
    { name = "ENC1", bits = "15:0" },
    { name = "ENC2", bits = "31:16" },
]

# ---- Snapshot: latched at every LOOP_TICK, published between frames, so a
# burst read of 0x30.. always returns one consistent sample.
# 0x38-0x3F reserved for the IMU (M5).

[[reg]]
name   = "SNAP_TICK"
addr   = 0x30
access = "RO"
reset  = 0
desc   = "TICK_COUNT of the snapshot (sequence number)"

[[reg]]
name   = "SNAP_TIME_US"
addr   = 0x31
access = "RO"
reset  = 0
desc   = "TIME_US at the tick"

[[reg]]
name   = "SNAP_INPUTS"
addr   = 0x32
access = "RO"
reset  = 0
desc   = "SWITCHES at the tick"

[[reg]]
name   = "SNAP_SAFETY"
addr   = 0x33
access = "RO"
reset  = 0
desc   = "ARM read bits in [3:0], FAULT_STATUS in [11:8], at the tick"

[[reg]]
name   = "SNAP_ENC1_COUNT"
addr   = 0x34
access = "RO"
reset  = 0
desc   = "Encoder 1 position at the tick: signed 32-bit, 4 counts per encoder line, up when A leads B"

[[reg]]
name   = "SNAP_ENC1_DELTA"
addr   = 0x35
access = "RO"
reset  = 0
desc   = "Encoder 1 counts since the previous tick (signed)"

[[reg]]
name   = "SNAP_ENC2_COUNT"
addr   = 0x36
access = "RO"
reset  = 0
desc   = "Encoder 2 position at the tick"

[[reg]]
name   = "SNAP_ENC2_DELTA"
addr   = 0x37
access = "RO"
reset  = 0
desc   = "Encoder 2 counts since the previous tick"
